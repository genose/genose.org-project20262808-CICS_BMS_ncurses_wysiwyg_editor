[package]
name = "cobol-bms-cli"
version = "0.1.0"
edition = "2021"
authors = ["genose.org"]
description = "CLI interface for COBOL BMS editor with ncurses-like TUI"
license = "MIT"

[[bin]]
name = "cobol-bms"
path = "src/main.rs"

[dependencies]
cobol-bms-core = { path = "../core" }
ratatui = "0.28"
crossterm = { version = "0.29", features = ["event-stream"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"  # For PNG, JPEG, TIFF, GIF, BMP, etc.
usvg = "0.37"  # For SVG parsing
resvg = "0.37" # For SVG rendering to raster
